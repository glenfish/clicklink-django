{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
    <h1>Forgot Password</h1>
    <form action="{% url 'forgot_password' %}" method="POST">
        {% csrf_token %}
        <label>Email:</label>
        <input type="email" name="email" required>
        <button type="submit">Send Reset Link</button>
    </form>
{% endblock %}
